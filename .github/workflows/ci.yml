name: ci
on: [push, pull_request]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: api/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q -m "not integration"
      - run: pip-audit -r requirements.txt   # vulnerabilidades conhecidas nas dependencias

  integration-postgres:
    runs-on: ubuntu-latest   # testcontainers usa o Docker do runner
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: api/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q -m integration
        env: { RUN_PG_TESTS: "1" }

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 20 }
      - run: npm install
      - run: npm run build   # tsc --noEmit + vite build

  workflows-and-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Workflows n8n gerados estao versionados
        run: python n8n/build_workflows.py && git diff --exit-code n8n/workflows
      - name: docker-compose valido
        run: cp .env.example .env && docker compose config -q && docker compose --profile observability config -q
